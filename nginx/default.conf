# nginx de homol. Base: o ~/default.conf do servidor (versão final do certbot),
# mais o client_max_body_size que o config_nginx.sh aplicava com sed e a senha
# no mail.homol (tickets/056, cards 01 e 08).
#
# Os dois domínios usam o mesmo certificado (live/api.homol…, com mail.homol
# como SAN). Domínio novo: certbot --expand com todos os -d.

server {
  server_name api.homol.vcnafacul.com.br;
  client_max_body_size 30M;

  location / {
    proxy_pass http://vcnafacul:3333;
    proxy_http_version 1.1;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  listen 443 ssl;
  listen [::]:443 ssl ipv6only=on;
  ssl_certificate /etc/letsencrypt/live/api.homol.vcnafacul.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.homol.vcnafacul.com.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name mail.homol.vcnafacul.com.br;
  auth_basic "Mailpit homol";
  auth_basic_user_file /etc/nginx/mail.htpasswd;

  location / {
    proxy_pass http://mailpit:8025;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/api.homol.vcnafacul.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.homol.vcnafacul.com.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.homol.vcnafacul.com.br mail.homol.vcnafacul.com.br;

  # desafio do certbot (renovação pelo plugin nginx)
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
