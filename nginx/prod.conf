# nginx de produção. Base: o default.conf final do certbot tirado do container
# antigo em 2026-11-01 (tickets/057, card 02), sem o location /images/ (a pasta
# Questoes saiu — imagens no R2) e com o desafio do certbot no bloco da porta 80.

server {
  server_name api.vcnafacul.com.br;
  client_max_body_size 30M;

  location / {
    proxy_pass http://vcnafacul:3333;
    proxy_http_version 1.1;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  listen [::]:443 ssl ipv6only=on;
  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/api.vcnafacul.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.vcnafacul.com.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.vcnafacul.com.br;

  # desafio do certbot (renovação pelo plugin nginx)
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
