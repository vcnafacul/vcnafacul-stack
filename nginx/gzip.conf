# Compressão das respostas (homol e prod). Fica no contexto http — o nginx.conf
# da imagem inclui conf.d/*.conf — e vale para todos os server.
#
# Motivo: a lista de inscritos (api #726) devolve ~1,3 MB de JSON para 300
# alunos, quase tudo o socioeconômico; JSON comprime de 5 a 10 vezes.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
# também quando a requisição chega por outro proxy (header Via)
gzip_proxied any;
gzip_vary on;
gzip_types
  application/json
  application/javascript
  application/xml
  text/css
  text/plain
  text/xml
  image/svg+xml;
